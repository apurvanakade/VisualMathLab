<!--
Minimal Google Analytics 4 snippet (v1.12.0), vendored verbatim from
https://dariusz.wieckiewicz.org/en/minimal-google-analytics-4-snippet/
by Dariusz Wieckiewicz. ~3kB instead of gtag.js's ~171kB; talks straight to
the GA4 Measurement Protocol v2 endpoint. No ads/remarketing signals, no
Google Signals, no cookies (client id lives in localStorage) - it only sends
page_view, scroll, click, file_download, view_search_results and
user_engagement events.

Two local modifications to the upstream code, both marked "LOCAL:" below:
  1. `tid` is this site's GA4 measurement ID (property 544270689).
  2. An early return on localhost/127.0.0.1 so `quarto preview` sessions
     don't pollute the property with development traffic.
  3. The <script> tag is `type="text/plain" data-consent="analytics"`, which
     is the consent gate: a browser will not execute a text/plain script, so
     this code is inert until _includes/consent.html re-creates it as a real
     script after the visitor allows analytics. Until then there are no
     requests to Google and nothing is written to localStorage.
  4. Do Not Track and Global Privacy Control are honoured, so a visitor
     signalling either is not measured even if they accepted the banner.
  5. `dl` (the reported page location) drops the query string. On this site a
     query string is the visitor's own input - the function they typed, their
     initial guess, their seed - which has no place in an analytics report,
     and which would also fragment one page into hundreds of distinct
     addresses. UTM campaign parameters are still read from the live URL, so
     referral attribution is unaffected.
  6. `searchKeys` is emptied, disabling site-search tracking. Quarto's navbar
     search is entirely client-side and never puts a query in the URL, while
     `?s=` here means something else entirely (the stage count on
     differential-equations/butcher-tableau) - with the upstream default
     that page's shared links would report as `view_search_results`
     instead of `page_view`.

Loaded via `include-after-body` (not `include-in-header`) in _quarto.yml:
the snippet reads document.body and document.title at call time, so it has
to run once the DOM exists.
-->
