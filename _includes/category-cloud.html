<!--
The homepage Gallery's category cloud (`categories: cloud`), styled. mathviz's
category-cloud chrome (`mathviz: {category-cloud: true}` in index.qmd's front
matter) moves the cloud out of the right margin, which is too narrow on this
layout and hidden on a phone, into a row above the cards
(`.vm-category-cloud`), and adds an "All" entry (`.category--all`) that
clears the filter. This file only styles it: the selected entry -- All when
nothing is filtered, which mathviz marks `.active` -- is a filled pill, and
All is always outlined, so the way back to every app is visible once a
filter is on. Without JS the cloud stays in the margin.
-->
<style>
.vm-category-cloud .quarto-listing-category {
  gap: 0.3rem 0.4rem;
  margin: 0 0 1.25rem;
}
.vm-category-cloud .category {
  color: var(--vm-accent);
  padding: 0.05rem 0.55rem;
  border: 1px solid transparent;
  border-radius: 999px;
}
.vm-category-cloud .category:hover {
  color: var(--vm-accent-hover);
  text-decoration: underline;
}
.vm-category-cloud .category--all {
  margin: 0;
  font-size: 1em;
  font-weight: 500;
  border-color: var(--vm-accent);
  cursor: pointer;
}
.vm-category-cloud .category.active {
  background: var(--vm-accent);
  border-color: var(--vm-accent);
  color: var(--vm-bg);
  text-decoration: none;
}
</style>
