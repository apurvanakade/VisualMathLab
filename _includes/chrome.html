<!--
This site's own chrome, in _chrome/: the split layout (a page wrapped in
::: {.vm-split} shows its .vm-app as a fixed pane beside the text), the
one-time "bigger screen" notice on a phone, and the vm-flow diagram
classes. They came from mathviz, which dropped them in v0.10.0 since no
other site used them; the files are still byte-identical to mathviz's last
copies (split.css adds the .vm-split rules from mathviz's embed.css), so the
meta names keep mathviz's spelling. The content of each meta is the
localStorage key that piece stores under; privacy.qmd lists both.

Root-relative URLs, since this include is the same on every page depth.
Loaded through include-in-header, which Quarto emits after every
dependency, so these rules follow mathviz's and Bootstrap's as before.
-->
<meta name="mathviz:split-width-key" content="vml-split-width">
<meta name="mathviz:mobile-warning-key" content="vml-mobile-warning-dismissed">
<link rel="stylesheet" href="/_chrome/split.css">
<link rel="stylesheet" href="/_chrome/mobile-warning.css">
<link rel="stylesheet" href="/_chrome/flow.css">
<script src="/_chrome/split.js"></script>
<script src="/_chrome/mobile-warning.js"></script>
