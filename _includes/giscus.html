<!--
Comments, via giscus (https://giscus.app): each app page's thread is a GitHub
Discussion in apurvanakade/VisualMathLab's "General" category, keyed by the
page's path.

This builds giscus's iframe itself instead of loading giscus.app/client.js,
for one reason: client.js sends the page's full address, query string
included, to giscus.app as the thread's `origin` and back link. On this site
the query string is the visitor's own math input, which privacy.qmd promises
never leaves for another origin (the same reason analytics drops it). Here
`origin` is the page's address without it. Everything else follows
client.js's own behaviour (v3, checked 2026-10-14): the `?giscus=` session
token GitHub sign-in returns with is moved into localStorage under
`giscus-session` and stripped from the address, and the frame's resize,
sign-out and bad-session messages are handled the same way.

Because `origin` has no query string, GitHub sign-in would bring a reader
back to the page's default inputs. So while signed out, the page's query
string is kept in sessionStorage (`vml-giscus-return`) as the page is left,
and a return with `?giscus=` to the same page reloads it with that query
string. It stays in this tab, on this site, and goes when the tab closes.

- Only pages with an app (`.vm-app`) get comments: not the homepage, topic
  listings, privacy or embed docs.
- On a split page the thread goes at the end of the prose column (the end of
  `.vm-split`, whose non-app children are that column); elsewhere at the end
  of the page's content.
- Never in embed mode: an embedded app shows the app alone and contacts no
  one it doesn't have to.
- The frame is `loading="lazy"`, so nothing is requested from giscus.app
  until a reader scrolls near the comments.
- Its theme follows the site's light/dark toggle (body.quarto-dark).
-->

<style>
  .vml-comments {
    margin-top: 3rem;
  }

  .vml-comments-frame {
    width: 100%;
    min-height: 150px;
    border: none;
    color-scheme: light dark;
  }
</style>

<script>
  (function () {
    var GISCUS = "https://giscus.app";
    var SESSION_KEY = "giscus-session";
    var RETURN_KEY = "vml-giscus-return";

    if (document.documentElement.classList.contains("vm-embed")) return;
    if (!document.querySelector(".vm-app")) return;

    var target = document.querySelector(".vm-split");
    if (!target) target = document.getElementById("quarto-document-content");
    if (!target) return;

    // GitHub sign-in comes back to this page with ?giscus=<session>.
    var url = new URL(location.href);
    var session = url.searchParams.get("giscus") || "";
    if (session) {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      } catch (e) {}
      // Back to the inputs the reader left with, if any (see above).
      var saved = null;
      try {
        saved = JSON.parse(sessionStorage.getItem(RETURN_KEY));
        sessionStorage.removeItem(RETURN_KEY);
      } catch (e) {}
      if (saved && saved.path === location.pathname && saved.search) {
        location.replace(location.pathname + saved.search);
        return;
      }
      url.searchParams.delete("giscus");
      history.replaceState(history.state, document.title, url.toString());
    } else {
      try {
        var stored = localStorage.getItem(SESSION_KEY);
        if (stored) session = JSON.parse(stored);
      } catch (e) {
        try { localStorage.removeItem(SESSION_KEY); } catch (e2) {}
      }
    }

    // Signed out, a GitHub sign-in may be about to leave the page: remember
    // its current inputs (the app keeps them in location.search).
    window.addEventListener("pagehide", function () {
      if (config.session) return;
      try {
        sessionStorage.setItem(RETURN_KEY, JSON.stringify({ path: location.pathname, search: location.search }));
      } catch (e) {}
    });

    function currentTheme() {
      if (document.body.classList.contains("quarto-dark")) return "dark";
      return "light";
    }

    // The page's address minus its query string and fragment.
    var origin = location.origin + location.pathname;
    var term = location.pathname.replace(/^\//, "").replace(/\/(index\.html)?$/, "");
    if (!term) term = "index";

    var description = "";
    var descriptionMeta = document.querySelector("meta[name='description']");
    if (descriptionMeta) description = descriptionMeta.content;

    var config = {
      origin: origin,
      session: session,
      theme: currentTheme(),
      reactionsEnabled: "1",
      emitMetadata: "0",
      inputPosition: "top",
      repo: "apurvanakade/VisualMathLab",
      repoId: "R_kgDOScZWIg",
      category: "General",
      categoryId: "DIC_kwDOScZWIs4DIeN2",
      strict: "1",
      description: description,
      backLink: origin,
      term: term
    };

    function widgetSrc() {
      return GISCUS + "/en/widget?" + new URLSearchParams(config);
    }

    var section = document.createElement("section");
    section.className = "vml-comments";
    section.setAttribute("data-vm-embed-hide", "");
    var heading = document.createElement("h2");
    heading.textContent = "Comments";
    section.appendChild(heading);

    var frame = document.createElement("iframe");
    frame.className = "vml-comments-frame";
    frame.title = "Comments";
    frame.setAttribute("scrolling", "no");
    frame.setAttribute("allow", "clipboard-write");
    frame.setAttribute("loading", "lazy");
    frame.src = widgetSrc();
    var frameLoaded = false;
    frame.addEventListener("load", function () { frameLoaded = true; });
    section.appendChild(frame);
    target.appendChild(section);

    function reloadWithoutSession() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      delete config.session;
      frame.src = widgetSrc();
    }

    window.addEventListener("message", function (event) {
      if (event.origin !== GISCUS) return;
      var data = event.data;
      if (typeof data !== "object" || data === null || !data.giscus) return;
      var message = data.giscus;
      if (message.resizeHeight) {
        frame.style.height = message.resizeHeight + "px";
      }
      if (message.signOut) {
        reloadWithoutSession();
        return;
      }
      var error = message.error;
      if (typeof error !== "string") return;
      if (error.includes("Bad credentials") || error.includes("Invalid state value") || error.includes("State has expired")) {
        if (config.session) reloadWithoutSession();
      }
    });

    // Follow the site's light/dark toggle.
    new MutationObserver(function () {
      var theme = currentTheme();
      if (theme === config.theme) return;
      config.theme = theme;
      if (frameLoaded) {
        frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, GISCUS);
      } else {
        // Not loaded yet (it is lazy): load it in the new theme instead.
        frame.src = widgetSrc();
      }
    }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  })();
</script>
