<!--
Third-party requests are a privacy surface, and privacy.qmd describes it, so
keep that page in step with anything added here or to the mathviz block in
_quarto.yml.

- The <meta name="referrer" content="same-origin"> that used to sit here is
  now emitted by the mathviz extension (`mathviz: {referrer: same-origin}` in
  _quarto.yml), because the extension's own CDN tags (math.js, Plotly) land
  in <head> *above* everything in include-in-header -- a meta here would come
  too late to cover them. Every page's query string is the visitor's own math
  input (see the URL-shareable inputs section of CLAUDE.md); the policy makes
  privacy.qmd's "no third party sees it" claim independent of browser
  defaults, and covers the MathJax and polyfill scripts Quarto injects too.
  scripts/analytics.test.js asserts the option is set;
  scripts/verify-analytics.mjs asserts the rendered order.
- Fonts are self-hosted from /fonts (see fonts/fonts.css for why), so the
  only third-party origins a page loads from are the two script CDNs the
  extension adds plus Quarto's MathJax (jsdelivr) and polyfill (cdnjs).
- The shared VM.* library, its CSS and the two CDN scripts are all injected
  by the mathviz extension -- nothing here loads them. Only site-specific
  scripts belong below.
-->

<link rel="stylesheet" href="/fonts/fonts.css">

<!-- Embed mode: another site frames one of these apps with
     <iframe src="https://www.visualmathlab.com/apps/newton-method/?embed=1&f=...">
     and gets the app alone -- styles.css hides the navbar, sidebar, rail,
     title block, footer and page navigation on html.vm-embed, plus everything
     in the content column that is not the page's tagged app (the
     <div class="vm-app"> each app page wraps its controls and chart in), and
     consent.html / mobile-warning.html / sidebar-rail.html / report-bug.js
     each skip themselves. This runs in <head>, so the class goes on <html>
     (<body> doesn't exist yet) and the chrome never paints at all -- no
     flash of navbar before the CSS applies.

     embed=1 shows the page's first .vm-app. A page with several tagged
     blocks gives each an id, and embed=<id> shows that one instead. Either
     way, once the DOM exists the chosen block gets vm-app-active, and
     styles.css shows only that block, what is inside it and its ancestors
     (Quarto wraps everything under a ## heading in a <section>, so a block
     is not necessarily a direct child of the content column). Until then
     the content column is blank -- DOMContentLoaded comes well before OJS
     draws anything, so nothing visible is ever hidden. An id no block on
     the page carries falls back to the first block rather than showing
     nothing.

     history.replaceState is wrapped because every app rewrites the URL with
     its current inputs (the `committed`/`urlSyncControls` cells) -- most start
     from location.search and so would keep embed, but a page that builds
     its query string from scratch (distribution-relationships does) would
     drop it, and the next reactive rerender would flash the chrome back in.
     Same-origin URLs only; a page never passes anything else. -->
<script>
(function () {
  var embed = new URLSearchParams(location.search).get("embed")
  if (embed == null || embed === "") return
  document.documentElement.classList.add("vm-embed")
  document.addEventListener("DOMContentLoaded", function () {
    var block = null
    if (embed !== "1") block = document.getElementById(embed)
    if (block === null || !block.classList.contains("vm-app")) {
      block = document.querySelector(".vm-app")
    }
    if (block !== null) block.classList.add("vm-app-active")
  })
  var replaceState = history.replaceState.bind(history)
  history.replaceState = function (state, title, url) {
    if (url != null) {
      var next = new URL(String(url), location.href)
      if (next.origin === location.origin && !next.searchParams.has("embed")) {
        next.searchParams.set("embed", embed)
      }
      url = next.pathname + next.search + next.hash
    }
    return replaceState(state, title, url)
  }
})()
</script>
