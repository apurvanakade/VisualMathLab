<!--
One-time "this site is built for larger screens" notice, shown on a phone
only. Charts on this site float draggable legend/step controls over the
plot (see styles.css's ".ojs-legend-overlay"/".ojs-step-overlay" media
query, hidden below the same 991.98px breakpoint this uses except in
fullscreen) since there isn't room for them alongside the chart on a phone
screen. This banner explains that once, remembered in localStorage so it
never shows again -- same shape as _includes/consent.html's banner, just a
single acknowledgement instead of a granted/denied choice.
-->

<style>
  .vml-mobile-warning {
    position: fixed;
    z-index: 1080;
    left: 1rem;
    right: 1rem;
    bottom: 1rem;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .vml-mobile-warning[hidden] {
    display: none;
  }

  .vml-mobile-warning-inner {
    pointer-events: auto;
    max-width: 32rem;
    padding: 1.1rem 1.25rem;
    border: 1px solid var(--bs-border-color, #dee2e6);
    border-radius: 0.5rem;
    background: var(--bs-body-bg, #fff);
    color: var(--bs-body-color, #212529);
    box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.18);
  }

  .vml-mobile-warning-title {
    margin: 0 0 0.4rem;
    padding: 0;
    border: none;
    font-size: 1rem;
    font-weight: 700;
  }

  .vml-mobile-warning-text {
    margin: 0;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .vml-mobile-warning-buttons {
    display: flex;
    justify-content: flex-end;
    margin-top: 0.9rem;
  }

  .vml-mobile-warning-btn {
    padding: 0.4rem 1rem;
    border: 1px solid var(--bs-primary, #2563eb);
    border-radius: 0.35rem;
    background: var(--bs-primary, #2563eb);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .vml-mobile-warning-btn:hover {
    filter: brightness(1.08);
  }
</style>

<div id="vml-mobile-warning" class="vml-mobile-warning" role="dialog" aria-labelledby="vml-mobile-warning-title" hidden>
  <div class="vml-mobile-warning-inner">
    <h2 id="vml-mobile-warning-title" class="vml-mobile-warning-title">Built for a bigger screen</h2>
    <p class="vml-mobile-warning-text">
      Visual Math Lab's charts use draggable controls that need more room than a phone screen offers, so
      they're hidden here. Tap a chart's fullscreen button to bring them back, or visit from a tablet or
      computer for the full experience.
    </p>
    <div class="vml-mobile-warning-buttons">
      <button type="button" class="vml-mobile-warning-btn" data-mobile-warning-dismiss>Got it</button>
    </div>
  </div>
</div>

<script>
(function () {
  const KEY = "vml-mobile-warning-dismissed"
  const BREAKPOINT = "(max-width: 991.98px)"
  const banner = document.getElementById("vml-mobile-warning")
  if (!banner) return

  function dismissed() {
    try {
      return localStorage.getItem(KEY) === "1"
    } catch (e) {
      return false
    }
  }

  function dismiss() {
    try {
      localStorage.setItem(KEY, "1")
    } catch (e) {
      /* Private browsing with storage blocked: the choice just won't stick. */
    }
    banner.hidden = true
  }

  const button = banner.querySelector("[data-mobile-warning-dismiss]")
  button.addEventListener("click", dismiss)

  if (window.matchMedia(BREAKPOINT).matches && !dismissed()) {
    banner.hidden = false
  }
})()
</script>
