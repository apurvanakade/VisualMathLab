project:
  type: website
  output-dir: docs
  # An explicit allowlist, not the default "render everything renderable" --
  # without it Quarto compiles the repo's own docs (CLAUDE.md,
  # CONTRIBUTING.md, README.md) into site pages too.
  render:
    - "*.qmd"
    - "**/*.qmd"
  resources:
    - CNAME

execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme:
      light: [_theme/vml-light.scss]
      dark: [_theme/vml-dark.scss]
    css: styles.css
    toc: true
    html-math-method: mathjax
    title-block-categories: false
    include-in-header:
      - _includes/head-scripts.html
    # Order matters: consent.html looks for the gated <script> that
    # analytics.html emits, so analytics.html has to be in the DOM first.
    # sidebar-rail.html reads/reacts to the sidebar's own DOM, so it belongs
    # after both.
    include-after-body:
      - _includes/analytics.html
      - _includes/consent.html
      - _includes/mobile-warning.html
      - _includes/sidebar-rail.html
    # Sidebar columns collapse to 0 above 992px too (styles.css), so the
    # remaining body column can run wider than Quarto's ~750px default -- a
    # 78vh chart needs the room. See styles.css's "Page grid" section.
    grid:
      body-width: 1000px
      sidebar-width: 260px
      margin-width: 200px

website:
  title: "Visual Math Lab"
  site-url: https://www.visualmathlab.com
  favicon: favicon.png
  open-graph: true
  twitter-card: true
  page-navigation: true
  # Off deliberately: with a one-level-deep site there is nothing to trace,
  # and Quarto gives an href-less `section:` the href of its first child, so
  # any grouping label in the sidebar would render as a crumb that mislinks.
  bread-crumbs: false

  navbar:
    left:
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/apurvanakade/VisualMathLab/issues
        aria-label: "Report a bug on GitHub"

  search:
    location: navbar
    type: textbox

  # Quarto's built-in `cookie-consent:` is deliberately NOT used here - its
  # banner copy is baked into the bundle and claims the site shows
  # personalized content and targeted ads, which is false. _includes/consent.html
  # is a small replacement with accurate copy. See CLAUDE.md.
  page-footer:
    center: "Copyright © 2025-2026 Apurva Nakade. Released under the [Apache 2.0 license](https://github.com/apurvanakade/VisualMathLab/blob/main/LICENSE). [Privacy](/privacy.qmd) · [Analytics preferences](#analytics-preferences)."

  # One level of topic sections, in reading order. Every app is listed by its
  # full apps/<slug>/index.qmd path rather than a glob: apps/ is flat, so
  # `apps/*/index.qmd` can't be split by topic, and this explicit order is
  # also what drives page-navigation prev/next.
  sidebar:
    - style: floating
      contents:
        - section: topics/root-finding/index.qmd
          contents:
            - apps/bisection-method/index.qmd
            - apps/fixed-point-iteration/index.qmd
            - apps/newton-method/index.qmd
            - apps/secant-method/index.qmd
        - section: topics/piecewise-interpolation/index.qmd
          contents:
            - apps/polynomial-interpolation/index.qmd
            - apps/numerical-integration/index.qmd
            - apps/adaptive-integration/index.qmd
        - section: topics/differential-equations/index.qmd
          contents:
            - apps/explicit-ode-methods/index.qmd
            - apps/implicit-ode-methods/index.qmd
            - apps/adaptive-ode-methods/index.qmd
            - apps/butcher-tableau/index.qmd
        - section: topics/sperners-lemma/index.qmd
          contents:
            - apps/barycentric-coordinates/index.qmd
            - apps/sperners-lemma-statement/index.qmd
            - apps/sperners-lemma-combinatorial-proof/index.qmd
            - apps/sperners-lemma-geometric-proof/index.qmd
        - section: topics/model-fitting/index.qmd
          contents:
            - apps/polynomial-fits/index.qmd
            - apps/l1-vs-l2-regression/index.qmd
        - section: topics/probability/index.qmd
          contents:
            - apps/positive-predictive-value/index.qmd
            - apps/recursive-filters-1d/index.qmd
