project:
  type: website
  output-dir: docs
  resources:
    - CNAME

execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme:
      light: cosmo
      dark: cyborg
    css: styles.css
    toc: true
    html-math-method: mathjax
    include-in-header:
      - _includes/head-scripts.html
    # Order matters: consent.html looks for the gated <script> that
    # analytics.html emits, so analytics.html has to be in the DOM first.
    include-after-body:
      - _includes/analytics.html
      - _includes/consent.html

website:
  title: "Visual Math Lab"
  site-url: https://www.visualmathlab.com
  page-navigation: true
  bread-crumbs: true

  navbar:
    background: light
    left:
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/apurvanakade/VisualMathLab/issues
        aria-label: "Report a bug on GitHub"

  search:
    location: navbar
    type: textbox

  # Quarto's built-in `cookie-consent:` is deliberately NOT used here - its
  # banner copy is baked into the bundle and claims the site shows
  # personalized content and targeted ads, which is false. _includes/consent.html
  # is a small replacement with accurate copy. See CLAUDE.md.
  page-footer:
    center: "Copyright © 2025-2026 Apurva Nakade. Released under the [Apache 2.0 license](https://github.com/apurvanakade/VisualMathLab/blob/main/LICENSE). [Privacy](/privacy.qmd) · [Analytics preferences](#analytics-preferences)."

  sidebar:
    - style: floating
      contents:
        - section: "Computational Math"
          contents:
          - section: root-finding/index.qmd
            contents: "root-finding/*/index.qmd"
          - section: piecewise-interpolation/index.qmd
            contents: "piecewise-interpolation/*/index.qmd"
          - section: differential-equations/index.qmd
            contents: "differential-equations/*/index.qmd"
        - section: "Discrete Math"
          contents:
          - section: sperners-lemma/index.qmd
            contents: "sperners-lemma/*/index.qmd"
        - section: "Data Science"
          contents:
          - section: model-fitting/index.qmd
            contents: "model-fitting/*/index.qmd"
          - section: clustering/index.qmd
            contents: "clustering/*/index.qmd"
        - section: "Probability"
          contents:
          - section: probability/bayes/index.qmd
            contents: "probability/bayes/*/index.qmd"
          - section: probability/recursive-filters/index.qmd
            contents: "probability/recursive-filters/*/index.qmd"
