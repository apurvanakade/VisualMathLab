project:
  type: website
  # Installs the latest tagged mathviz release into
  # _extensions/apurvanakade/mathviz/ before every render (at most hourly in
  # preview; offline it keeps the installed copy). See CLAUDE.md.
  # build-sidebar.mjs then writes _sidebar.yml (loaded below) from every
  # page's topic:/order: front matter.
  pre-render:
    - scripts/update-mathviz.sh
    - scripts/build-sidebar.mjs
  output-dir: docs
  # An explicit allowlist, not the default "render everything renderable" --
  # without it Quarto compiles the repo's own docs (CLAUDE.md,
  # CONTRIBUTING.md, README.md) into site pages too.
  render:
    - "*.qmd"
    - "**/*.qmd"
  resources:
    - CNAME

# The sidebar: one section per topic page, holding every app whose topic:
# names it, both in order: order (which also drives page-navigation
# prev/next). Generated by scripts/build-sidebar.mjs -- edit front matter,
# not that file. See CLAUDE.md.
metadata-files:
  - _sidebar.yml

execute:
  echo: false
  warning: false
  message: false

# The shared chart/control/numerics library (window.VM, the ojs-* design
# system, the --vm-* tokens) is the mathviz Quarto extension, installed from
# apurvanakade/mathviz's latest release by the pre-render hook above. Its
# filter puts math.js, Plotly, mathviz.js and
# mathviz.css into every page's <head>, in that order -- ahead of everything
# in include-in-header. See CLAUDE.md.
filters:
  - mathviz
mathviz:
  # Emitted as <meta name="referrer"> ahead of the CDN tags the filter adds,
  # so no third-party origin sees a page's path or query string (which is
  # the visitor's own math input). privacy.qmd states this; keep them in step.
  referrer: same-origin
  # Inter and JetBrains Mono, self-hosted from the extension (see its
  # fonts/fonts.css for why never Google Fonts). The mathviz theme below
  # names both faces; privacy.qmd states that no font request leaves the site.
  fonts: true
  # The collapsible sidebar rail (off-canvas sidebar + hamburger rail), with
  # its pin kept under this localStorage key -- privacy.qmd lists it.
  sidebar-rail: vml-sidebar-pinned
  # A title search at the top of the sidebar. Full-text search stays in the
  # navbar: Quarto allows one per page, and the sidebar is off-canvas.
  sidebar-search: true
  # The split layout for app-first pages (::: {.vm-split}), with the
  # divider's width kept under this localStorage key -- privacy.qmd lists it.
  split: vml-split-width
  # The one-time "bigger screen" notice on a phone; privacy.qmd lists its key.
  mobile-warning: vml-mobile-warning-dismissed
  # The Share button on every .vm-app (which turns on ?embed= mode too).
  # Links point at site-url (repeated from website: below -- the extension
  # can't read project config); embed.qmd is the page explaining it.
  share:
    site-url: https://www.visualmathlab.com
    embed-docs: embed.html
  # "Report bug" on a text selection files an issue here, linking the
  # page's .qmd source on main.
  report-bug:
    repo: apurvanakade/VisualMathLab

format:
  html:
    # mathviz's optional Quarto theme, generated from its tokens.css so the
    # Bootstrap chrome and the mathviz panels share one palette. A site-only
    # override goes in a second file listed after each of these.
    theme:
      light: [_extensions/apurvanakade/mathviz/theme/mathviz-light.scss]
      dark: [_extensions/apurvanakade/mathviz/theme/mathviz-dark.scss]
    toc: false
    html-math-method: mathjax
    # Order matters: consent.html looks for the gated <script> that
    # analytics.html emits, so analytics.html has to be in the DOM first.
    include-after-body:
      - _includes/analytics.html
      - _includes/consent.html
      # giscus comments on app pages; at the end of the prose column on a
      # split page. See its header comment for why it isn't client.js.
      - _includes/giscus.html
      # A tag anywhere but the homepage opens the homepage Gallery filtered
      # to it. See its header comment.
      - _includes/category-links.html
    # Sidebar columns collapse to 0 above 992px too (the sidebar rail's CSS,
    # _mathviz/src/chrome/sidebar-rail.css), so the remaining body column can
    # run wider than Quarto's ~750px default -- a 78vh chart needs the room.
    grid:
      body-width: 1000px
      sidebar-width: 260px
      margin-width: 200px

website:
  title: "Visual Math Lab"
  site-url: https://www.visualmathlab.com
  favicon: favicon.png
  open-graph: true
  twitter-card: true
  page-navigation: true
  # Off deliberately: with a one-level-deep site there is nothing to trace,
  # and Quarto gives an href-less `section:` the href of its first child, so
  # any grouping label in the sidebar would render as a crumb that mislinks.
  bread-crumbs: false

  navbar:
    right:
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/apurvanakade/VisualMathLab/issues
        aria-label: "Report a bug on GitHub"

  search:
    location: navbar
    type: textbox

  # Quarto's built-in `cookie-consent:` is deliberately NOT used here - its
  # banner copy is baked into the bundle and claims the site shows
  # personalized content and targeted ads, which is false. _includes/consent.html
  # is a small replacement with accurate copy. See CLAUDE.md.
  page-footer:
    center: "Copyright © 2026 Apurva Nakade. Released under the [Apache 2.0 license](https://github.com/apurvanakade/VisualMathLab/blob/main/LICENSE). [Privacy](/privacy.qmd) · [Analytics preferences](#analytics-preferences) · [Embed an app](/embed.qmd)."
