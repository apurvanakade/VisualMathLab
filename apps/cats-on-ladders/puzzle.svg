Authors: Apurva Nakade
The opening puzzle's setup: a ladder leaning against a wall, a cat on its
middle rung, and arrows for the way each end slides. Deliberately no path.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- Drawn with the wall on the right, then mirrored so the wall is on the
       left, as in the apps, where the foot slides right with the slider. -->
  <g transform="matrix(-1 0 0 1 200 0)">
  <!-- Wall and floor, shaded behind. -->
  <rect x="165" y="12" width="10" height="174" fill="#94a3b8" fill-opacity="0.25"/>
  <rect x="12" y="178" width="153" height="8" fill="#94a3b8" fill-opacity="0.25"/>
  <path d="M 165 12 L 165 178 L 12 178" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- The ladder: two rails and its rungs, the middle one heavier. -->
  <line x1="86.54" y1="176.00" x2="161.54" y2="46.10" stroke="#ef4444" stroke-width="2"/>
  <line x1="93.46" y1="180.00" x2="168.46" y2="50.10" stroke="#ef4444" stroke-width="2"/>
  <line x1="94.04" y1="163.01" x2="100.96" y2="167.01" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="101.54" y1="150.02" x2="108.46" y2="154.02" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="109.04" y1="137.03" x2="115.96" y2="141.03" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="116.54" y1="124.04" x2="123.46" y2="128.04" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="124.04" y1="111.05" x2="130.96" y2="115.05" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="131.54" y1="98.06" x2="138.46" y2="102.06" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="139.04" y1="85.07" x2="145.96" y2="89.07" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="146.54" y1="72.08" x2="153.46" y2="76.08" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="154.04" y1="59.09" x2="160.96" y2="63.09" stroke="#ef4444" stroke-width="1.5"/>
  <!-- The cat, on the middle rung. -->
  <g fill="#f59e0b">
    <ellipse cx="127.50" cy="103.05" rx="5.5" ry="7"/>
    <circle cx="127.50" cy="93.05" r="4.5"/>
    <path d="M 123.30 91.55 L 124.00 85.05 L 126.70 89.05 z"/>
    <path d="M 131.70 91.55 L 131.00 85.05 L 128.30 89.05 z"/>
  </g>
  <path d="M 131.50 108.05 Q 140.50 108.05 138.50 98.05" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- The top slides down the wall, the foot along the floor. -->
  <line x1="170" y1="34.10" x2="170" y2="78.10" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="98.00" y1="182" x2="48.00" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>
</svg>
