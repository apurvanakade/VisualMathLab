The opening puzzle's setup: a circle of radius 1 inside a circle of radius 2,
one point on the small circle marked. Deliberately no traced path.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- Fixed circle, radius 2. -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Rolling circle, radius 1, touching the fixed circle at 40 degrees. -->
  <circle cx="134.47" cy="71.07" r="45" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="134.47" cy="71.07" r="2" fill="#ef4444"/>
  <line x1="134.47" y1="71.07" x2="92.18" y2="86.46" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Direction of rolling. -->
  <path d="M 120.71 22.73 A 80 80 0 0 0 72.64 24.82" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- The tracked point. -->
  <circle cx="92.18" cy="86.46" r="5" fill="#3b82f6"/>
</svg>
